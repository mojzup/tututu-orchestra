<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  {% assign full_title = page.title | append: " - Tututu Orchestra" %}
  {% if page.url == '/' %}{% assign full_title = "Tututu Orchestra" %}{% endif %}
  <title>{{ full_title | escape }}</title>
  <meta name="description" content="{{ page.description | default: 'Tututu Orchestra, an international conducted improvisation orchestra.' | escape }}" />
  <meta property="og:title" content="{{ full_title | escape }}" />
  <meta property="og:description" content="{{ page.description | default: 'Tututu Orchestra, an international conducted improvisation orchestra.' | escape }}" />
  <link rel="icon" type="image/png" href="/images/sun.png" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  {% if page.css %}<link rel="stylesheet" href="/css/{{ page.css }}.css" />{% endif %}
</head>
<body>
  {% include header.html %}
  {{ content }}
  {% include footer.html %}
</body>
</html>
